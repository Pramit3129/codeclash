services:
  redis:
    image: redis:7-alpine

    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction

    ports:
      - "6379:6379"

    restart: unless-stopped

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      redis:
        condition: service_healthy

    environment:
      REDIS_URL: redis://redis:6379

    command: npx tsx watch src/server.ts

volumes:
  redis-data: