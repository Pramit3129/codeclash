services:
  judge-worker:
    image: ghcr.io/pramit3129/codeclash-judge-worker:latest

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - dokploy-network

    restart: unless-stopped

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  dokploy-network:
    external: true