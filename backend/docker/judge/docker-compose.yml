services:
  judge-worker:
    image: ghcr.io/pramit3129/codeclash-judge-worker:latest

    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}

      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

      # Must match the bind mount below on both sides.
      JUDGE_WORK_DIR: /tmp/algoriumx

      # Judge jobs processed in parallel. Each concurrent job holds a
      # sandbox at the compile budget below while building, then drops to
      # the problem's memory limit, so raise this only with host capacity
      # to match - oversubscription inflates wall-clock time and causes
      # spurious TLE verdicts.
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-1}

      # Compilers need far more memory than the programs they emit; g++ on
      # <bits/stdc++.h> is OOM-killed below ~320MB. Budget for
      # JUDGE_COMPILE_MEMORY_MB x JUDGE_CONCURRENCY of headroom.
      JUDGE_COMPILE_MEMORY_MB: ${JUDGE_COMPILE_MEMORY_MB:-768}
      JUDGE_COMPILE_CPUS: ${JUDGE_COMPILE_CPUS:-2}

      # Applied to user code, after compilation.
      JUDGE_RUNTIME_CPUS: ${JUDGE_RUNTIME_CPUS:-0.5}

      # Sandbox /tmp, holding build output only.
      JUDGE_TMPFS_MB: ${JUDGE_TMPFS_MB:-128}

      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      COOKIE_NAME: ${COOKIE_NAME}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      GITHUB_SCOPES: ${GITHUB_SCOPES}

    # JUDGE_WORK_DIR must be identical on the host and inside this
    # container. The worker asks the HOST daemon to bind-mount each
    # submission directory into a sandbox, and the daemon resolves that
    # path on the host. If the path exists only inside this container,
    # Docker creates an empty directory on the host instead and every
    # submission fails with "No such file or directory".
    volumes:
      # The worker drives the host daemon to create sandbox containers.
      # This socket is mounted ONLY here, never into a sandbox.
      - /var/run/docker.sock:/var/run/docker.sock

      # Same path on both sides - see the note above.
      - /tmp/algoriumx:/tmp/algoriumx

    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true